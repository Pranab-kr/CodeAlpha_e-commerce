<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Account: Bench Supply</title>
    <meta name="description" content="Your Bench Supply account details and order history." />
    <link rel="stylesheet" href="css/app.css" />
    <script type="module" src="js/pages/account.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header id="site-header"></header>

    <main id="main" class="container">
      <section class="page-head" aria-labelledby="account-title">
        <h1 id="account-title">Account</h1>
        <p class="page-line" data-account-line>Loading your account.</p>
      </section>

      <div class="account-layout">
        <section class="account-panel cut" aria-labelledby="account-details-title">
          <h2 class="account-panel-title" id="account-details-title">Details</h2>
          <dl class="account-details">
            <div>
              <dt>Name</dt>
              <dd data-account-name>Loading</dd>
            </div>
            <div>
              <dt>Email</dt>
              <dd data-account-email>Loading</dd>
            </div>
          </dl>
          <button class="key key--small account-signout" type="button" data-logout>Sign out</button>
        </section>

        <section class="account-orders" aria-labelledby="account-orders-title">
          <div class="cart-lines-head">
            <h2 class="cart-lines-title" id="account-orders-title">Orders</h2>
          </div>
          <div data-orders aria-busy="true"></div>
        </section>
      </div>
    </main>

    <footer id="site-footer"></footer>
  </body>
</html>
