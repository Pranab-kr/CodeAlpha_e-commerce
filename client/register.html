<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create an account: Bench Supply</title>
    <meta
      name="description"
      content="Create a Bench Supply account to keep your cart, check out, and review orders."
    />
    <link rel="stylesheet" href="css/app.css" />
    <script type="module" src="js/pages/register.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header id="site-header"></header>

    <main id="main" class="container auth-main">
      <section class="auth-panel cut" aria-labelledby="register-title">
        <h1 id="register-title">Create an account</h1>
        <p class="auth-line">One account for the cart and your orders.</p>

        <form class="form-stack" data-auth-form novalidate>
          <div class="field">
            <label for="name">Full name</label>
            <input
              id="name"
              name="name"
              type="text"
              autocomplete="name"
              required
              aria-describedby="name-error"
            />
            <p class="field-error" id="name-error" data-error-for="name" hidden></p>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
              aria-describedby="email-error"
            />
            <p class="field-error" id="email-error" data-error-for="email" hidden></p>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              required
              aria-describedby="password-hint password-error"
            />
            <p class="field-hint" id="password-hint">
              8 characters or more, with at least one letter and one number.
            </p>
            <p class="field-error" id="password-error" data-error-for="password" hidden></p>
          </div>

          <p class="form-error" data-form-error role="alert" hidden></p>

          <button class="key key--primary key--block" type="submit" data-submit>
            Create account
          </button>
        </form>

        <p class="auth-alt">
          Already have an account?
          <a href="login.html" data-login-link>Sign in</a>
        </p>
      </section>
    </main>

    <footer id="site-footer"></footer>
  </body>
</html>
