<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Order: Bench Supply</title>
    <meta name="description" content="Your Bench Supply order receipt." />
    <link rel="stylesheet" href="css/app.css" />
    <script type="module" src="js/pages/order.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header id="site-header"></header>

    <main id="main" class="container">
      <section class="page-head" aria-labelledby="order-title">
        <h1 id="order-title" data-order-title>Order</h1>
        <p class="page-line" data-order-line>Loading order.</p>
      </section>

      <div data-order-loading aria-busy="true">
        <div class="skeleton-row" aria-hidden="true">
          <div class="skeleton-line skeleton-line--short"></div>
          <div class="skeleton-line skeleton-line--medium"></div>
          <div class="skeleton-line"></div>
        </div>
      </div>

      <div data-order-state hidden></div>

      <article class="receipt cut" data-order-receipt hidden aria-labelledby="receipt-title">
        <div class="receipt-head">
          <h2 class="checkout-panel-title" id="receipt-title">Receipt</h2>
          <span class="receipt-date" data-order-date></span>
        </div>

        <section class="receipt-section" aria-labelledby="order-details-title">
          <h2 id="order-details-title">Order details</h2>
          <dl class="receipt-meta">
            <div>
              <dt>Status</dt>
              <dd data-order-status></dd>
            </div>
            <div>
              <dt>Payment</dt>
              <dd data-order-payment></dd>
            </div>
            <div>
              <dt>Order number</dt>
              <dd data-order-number></dd>
            </div>
          </dl>
        </section>

        <section class="receipt-section" aria-labelledby="order-shipping-title">
          <h2 id="order-shipping-title">Ship to</h2>
          <div class="receipt-address" data-order-address></div>
        </section>

        <section class="receipt-section" aria-labelledby="order-items-title">
          <h2 id="order-items-title">Items</h2>
          <div class="table-scroll" tabindex="0" role="region" aria-label="Order items">
            <table class="order-table">
              <thead>
                <tr>
                  <th scope="col">Product</th>
                  <th scope="col">Unit price</th>
                  <th scope="col">Quantity</th>
                  <th scope="col">Line total</th>
                </tr>
              </thead>
              <tbody data-order-items></tbody>
            </table>
          </div>
        </section>

        <section class="receipt-section" aria-label="Order totals">
          <div class="receipt-totals">
            <div class="receipt-total-row">
              <span>Subtotal</span>
              <span data-order-subtotal></span>
            </div>
            <div class="receipt-total-row">
              <span>Shipping</span>
              <span data-order-shipping></span>
            </div>
            <div class="receipt-total-row receipt-grand-total">
              <span>Total</span>
              <span data-order-total></span>
            </div>
          </div>
        </section>

        <div class="receipt-actions">
          <a class="text-link" href="account.html">Back to account</a>
          <span class="receipt-note">Demo order. No payment was processed.</span>
        </div>
      </article>
    </main>

    <footer id="site-footer"></footer>
  </body>
</html>
