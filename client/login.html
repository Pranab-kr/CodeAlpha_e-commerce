<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in: Bench Supply</title>
    <meta
      name="description"
      content="Sign in to your Bench Supply account to check out and review your orders."
    />
    <link rel="stylesheet" href="css/app.css" />
    <script type="module" src="js/pages/login.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header id="site-header"></header>

    <main id="main" class="container auth-main">
      <section class="auth-panel cut" aria-labelledby="login-title">
        <h1 id="login-title">Sign in</h1>
        <p class="auth-line">Use your email and password.</p>

        <form class="form-stack" data-auth-form novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
              aria-describedby="email-error"
            />
            <p class="field-error" id="email-error" data-error-for="email" hidden></p>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              aria-describedby="password-error"
            />
            <p class="field-error" id="password-error" data-error-for="password" hidden></p>
          </div>

          <p class="form-error" data-form-error role="alert" hidden></p>

          <button class="key key--primary key--block" type="submit" data-submit>Sign in</button>
        </form>

        <p class="auth-alt">
          New here?
          <a href="register.html" data-register-link>Create an account</a>
        </p>
      </section>
    </main>

    <footer id="site-footer"></footer>
  </body>
</html>
