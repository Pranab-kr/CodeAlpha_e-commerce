<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cart: Bench Supply</title>
    <meta
      name="description"
      content="Review the items in your Bench Supply cart. Prices and totals are computed by the server."
    />
    <link rel="stylesheet" href="css/app.css" />
    <script type="module" src="js/pages/cart.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header id="site-header"></header>

    <main id="main" class="container">
      <section class="page-head" aria-labelledby="cart-title">
        <h1 id="cart-title">Cart</h1>
        <p class="page-line" data-cart-line aria-live="polite">Loading cart.</p>
      </section>

      <div class="cart-layout">
        <section class="cart-lines" aria-labelledby="cart-lines-title">
          <div class="cart-lines-head">
            <h2 class="cart-lines-title" id="cart-lines-title">Items</h2>
            <button class="remove-link" type="button" data-clear-cart hidden>Clear cart</button>
          </div>
          <div data-cart-lines aria-busy="true"></div>
        </section>

        <aside class="cart-summary cut" data-cart-summary aria-labelledby="summary-title" hidden>
          <h2 class="summary-title" id="summary-title">Summary</h2>
          <div class="summary-rows">
            <div class="summary-row">
              <span>Subtotal</span>
              <span data-summary-subtotal>$0.00</span>
            </div>
            <div class="summary-row">
              <span>Shipping</span>
              <span data-summary-shipping>$0.00</span>
            </div>
            <div class="summary-row summary-total">
              <span>Total</span>
              <span data-summary-total>$0.00</span>
            </div>
          </div>
          <div class="summary-actions">
            <a class="key key--primary key--block" href="checkout.html">Checkout</a>
            <a class="text-link" href="products.html">Continue shopping</a>
          </div>
          <p class="summary-note" data-free-shipping-note>
            Free shipping on larger orders. Checkout is a demo; no payment is taken.
          </p>
        </aside>
      </div>

      <section
        class="cart-empty-featured"
        data-empty-featured
        aria-labelledby="empty-featured-title"
        hidden
      >
        <div class="section-head">
          <h2 id="empty-featured-title">A place to start</h2>
          <p class="section-line">Three tools from the catalog.</p>
        </div>
        <div class="product-grid product-grid--related" data-empty-products></div>
      </section>
    </main>

    <footer id="site-footer"></footer>
  </body>
</html>
